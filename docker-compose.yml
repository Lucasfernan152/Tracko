services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-tracko}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - tracko_postgres:/var/lib/postgresql/data
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tracko}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "${MQTT_HOST_PORT:-1883}:1883"
    volumes:
      - ./deploy/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-tracko}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-tracko}
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  tracko:
    build: .
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mosquitto:
        condition: service_started
    ports:
      - "${TRACKO_HTTP_PORT:-8080}:${HTTP_PORT:-8080}"
    environment:
      POSTGRES_DSN: ${POSTGRES_DSN:-}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-tracko}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-disable}
      MQTT_URL: ${MQTT_URL:-}
      MQTT_HOST: ${MQTT_HOST:-mosquitto}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_TOPIC: ${MQTT_TOPIC:-trips/+/location}
      RABBITMQ_URL: ${RABBITMQ_URL:-}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-tracko}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-tracko}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:-vehicle_telemetry_queue}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-amq.topic}
      RABBITMQ_ROUTING_KEY: ${RABBITMQ_ROUTING_KEY:-vehicles.*.location}
      HTTP_ADDR: ${HTTP_ADDR:-}
      HTTP_PORT: ${HTTP_PORT:-8080}
      WS_PATH: ${WS_PATH:-/ws/tracking}
      WS_ADDR: ${WS_ADDR:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${HTTP_PORT:-8080}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  tracko_postgres:
